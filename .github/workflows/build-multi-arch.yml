name: build-multi-arch

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本号，例如 v0.3.1；留空则只构建产物"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: 校验版本号
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          release_tag=""
          if [[ -n "$RELEASE_TAG" ]]; then
            release_tag="$RELEASE_TAG"
            if [[ ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z]+)?$ ]]; then
              echo "版本号必须以 v 开头，例如 v0.3.1，当前值：$release_tag" >&2
              exit 1
            fi
          fi
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  linux-build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-22.04
          - arch: arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 安装 WebView 前端依赖
        working-directory: crates/app/webview-ui
        run: |
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: 构建 WebView 前端
        working-directory: crates/app/webview-ui
        run: |
          bun run build

      - name: 校验 WebView 前端产物
        run: |
          test -f crates/app/webview-ui/dist/index.html
          test -d crates/app/webview-ui/dist/assets
          find crates/app/webview-ui/dist/assets -type f | grep -q .

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: 构建固定工具链镜像
        run: |
          docker build --network host -t rust-glibc231:20.04-oqqwall -f Dockerfile.rust-glibc231-toolchain .

      - name: 执行拆分打包脚本
        run: |
          export OQQWALL_DOCKER_DATA_DIR="$(dirname "$GITHUB_WORKSPACE")"
          bash ./scripts/package_split_release.sh

      - name: 重命名多架构产物
        id: artifacts
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          bin_src="dist/OQQWall_RUST"
          bin_dst="dist/OQQWall_RUST-linux-${ARCH}"

          mv "$bin_src" "$bin_dst"

          echo "bin_path=$bin_dst" >> "$GITHUB_OUTPUT"
          echo "bin_name=$(basename "$bin_dst")" >> "$GITHUB_OUTPUT"

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.bin_name }}
          path: ${{ steps.artifacts.outputs.bin_path }}
          compression-level: 0
          if-no-files-found: error

  res-package:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 打包公共资源
        run: |
          set -euo pipefail
          mkdir -p dist
          tmp_tar="dist/.res-build.tar"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C . -cf "$tmp_tar" res
          gzip -n -f "$tmp_tar"
          mv "${tmp_tar}.gz" "dist/OQQWall_RUST-res.tar.gz"

      - name: 上传资源包
        uses: actions/upload-artifact@v4
        with:
          name: OQQWall_RUST-res
          path: dist/OQQWall_RUST-res.tar.gz
          compression-level: 0
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-release
      - linux-build
      - res-package
    if: ${{ needs.prepare-release.outputs.release_tag != '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 amd64 产物
        uses: actions/download-artifact@v4
        with:
          name: OQQWall_RUST-linux-amd64
          path: release-dist

      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: OQQWall_RUST-linux-arm64
          path: release-dist

      - name: 下载资源包
        uses: actions/download-artifact@v4
        with:
          name: OQQWall_RUST-res
          path: release-dist

      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            release-dist/OQQWall_RUST-linux-amd64 \
            release-dist/OQQWall_RUST-linux-arm64 \
            release-dist/OQQWall_RUST-res.tar.gz
