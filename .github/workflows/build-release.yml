name: package-split-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本号，例如 v0.3.1；留空则只构建产物"
        required: false
        type: string
      release_notes:
        description: "可选的 Release note；留空则自动生成"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs_on: ubuntu-22.04
            binary_name: OQQWall_RUST-x86
            checksum_name: SHA256SUMS-x86.txt
            upload_res: true
          - arch: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
            binary_name: OQQWall_RUST-arm
            checksum_name: SHA256SUMS-arm.txt
            upload_res: false
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-
            ${{ runner.os }}-cargo-

      - name: 构建 WebView 前端
        working-directory: crates/app/webview-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: 构建固定工具链镜像
        run: |
          docker build --network host -t rust-glibc231:20.04-oqqwall -f Dockerfile.rust-glibc231-toolchain .

      - name: 执行拆分打包脚本
        run: |
          export OQQWALL_DOCKER_DATA_DIR="$(dirname "$GITHUB_WORKSPACE")"
          bash ./scripts/package_split_release.sh

      - name: 重命名架构产物
        run: |
          mv dist/OQQWall_RUST "dist/${{ matrix.binary_name }}"

      - name: 生成二进制校验文件
        run: |
          sha256sum "dist/${{ matrix.binary_name }}" > "dist/${{ matrix.checksum_name }}"

      - name: 上传二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            dist/${{ matrix.binary_name }}
            dist/${{ matrix.checksum_name }}
          compression-level: 0
          if-no-files-found: error

      - name: 生成资源校验文件
        if: ${{ matrix.upload_res }}
        run: |
          sha256sum dist/OQQWall_RUST-res-*.tar.gz > dist/SHA256SUMS-res.txt

      - name: 上传资源包
        if: ${{ matrix.upload_res }}
        uses: actions/upload-artifact@v4
        with:
          name: OQQWall_RUST-res
          path: |
            dist/OQQWall_RUST-res-*.tar.gz
            dist/SHA256SUMS-res.txt
          compression-level: 0
          if-no-files-found: error

  publish-release:
    needs: linux-build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
    runs-on: ubuntu-22.04
    steps:
      - name: 下载 amd64 产物
        uses: actions/download-artifact@v4
        with:
          name: OQQWall_RUST-x86
          path: release-dist

      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: OQQWall_RUST-arm
          path: release-dist

      - name: 下载资源包
        uses: actions/download-artifact@v4
        with:
          name: OQQWall_RUST-res
          path: release-dist

      - name: 汇总校验文件
        run: |
          cat release-dist/SHA256SUMS-x86.txt \
            release-dist/SHA256SUMS-arm.txt \
            release-dist/SHA256SUMS-res.txt > release-dist/SHA256SUMS.txt

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' || inputs.release_notes == '' }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-dist/OQQWall_RUST-x86
            release-dist/OQQWall_RUST-arm
            release-dist/OQQWall_RUST-res-*.tar.gz
            release-dist/SHA256SUMS.txt
            release-dist/SHA256SUMS-arm.txt
