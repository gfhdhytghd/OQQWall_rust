name: package-split-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本号，例如 v0.3.1；留空则只构建产物"
        required: false
        type: string
      release_notes:
        description: "可选的 Release note；留空则自动生成"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 构建 WebView 前端
        working-directory: crates/app/webview-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: 构建固定工具链镜像
        run: |
          docker build --network host -t rust-glibc231:20.04-oqqwall -f Dockerfile.rust-glibc231-toolchain .

      - name: 执行拆分打包脚本
        run: |
          export OQQWALL_DOCKER_DATA_DIR="$(dirname "$GITHUB_WORKSPACE")"
          bash ./scripts/package_split_release.sh

      - name: 生成校验文件
        run: |
          sha256sum dist/OQQWall_RUST dist/OQQWall_RUST-res-*.tar.gz > dist/SHA256SUMS.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: OQQWall_RUST-split-release
          path: |
            dist/OQQWall_RUST
            dist/OQQWall_RUST-res-*.tar.gz
            dist/SHA256SUMS.txt

      - name: 发布到 GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.release_notes || '' }}
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' || inputs.release_notes == '' }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/OQQWall_RUST
            dist/OQQWall_RUST-res-*.tar.gz
            dist/SHA256SUMS.txt
