name: package-split-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的标签，例如 v0.3.1；留空时只构建 Actions 产物"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  linux-release:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 解析发布标签
        id: release
        env:
          DISPATCH_TAG: ${{ github.event.inputs.release_tag || '' }}
        run: |
          release_tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi
          if [[ -n "$DISPATCH_TAG" ]]; then
            release_tag="$DISPATCH_TAG"
          fi
          if [[ -n "$release_tag" && ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+)*([-.][0-9A-Za-z]+)?$ ]]; then
            echo "发布标签必须以 v 开头，例如 v0.3.1，当前值：$release_tag" >&2
            exit 1
          fi
          echo "tag_name=$release_tag" >> "$GITHUB_OUTPUT"

      - name: 切换到发布标签
        if: ${{ steps.release.outputs.tag_name != '' }}
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag_name }}
          submodules: recursive

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 安装 WebView 前端依赖
        working-directory: crates/app/webview-ui
        run: |
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: 构建 WebView 前端
        working-directory: crates/app/webview-ui
        run: |
          bun run build

      - name: 校验 WebView 前端产物
        run: |
          test -f crates/app/webview-ui/dist/index.html
          test -d crates/app/webview-ui/dist/assets
          find crates/app/webview-ui/dist/assets -type f | grep -q .

      - name: 缓存 Cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 构建固定工具链镜像
        run: |
          docker build --network host -t rust-glibc231:20.04-oqqwall -f Dockerfile.rust-glibc231-toolchain .

      - name: 执行拆分打包脚本
        run: |
          export OQQWALL_DOCKER_DATA_DIR="$(dirname "$GITHUB_WORKSPACE")"
          bash ./scripts/package_split_release.sh

      - name: 生成校验文件
        run: |
          sha256sum dist/OQQWall_RUST dist/OQQWall_RUST-res-*.tar.gz > dist/SHA256SUMS.txt

      - name: 收集发布文件
        id: release_files
        run: |
          shopt -s nullglob
          res_packages=(dist/OQQWall_RUST-res-*.tar.gz)
          if [[ "${#res_packages[@]}" -ne 1 ]]; then
            echo "期望找到 1 个资源包，实际找到 ${#res_packages[@]} 个" >&2
            printf '%s\n' "${res_packages[@]}" >&2
            exit 1
          fi
          echo "res_pkg=${res_packages[0]}" >> "$GITHUB_OUTPUT"
          echo "res_name=$(basename "${res_packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: 上传可执行文件
        uses: actions/upload-artifact@v4
        with:
          name: OQQWall_RUST
          path: dist/OQQWall_RUST
          compression-level: 0
          if-no-files-found: error

      - name: 上传资源包
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release_files.outputs.res_name }}
          path: ${{ steps.release_files.outputs.res_pkg }}
          compression-level: 0
          if-no-files-found: error

      - name: 上传校验文件
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS.txt
          path: dist/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: steps.release.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.tag_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/OQQWall_RUST
            dist/OQQWall_RUST-res-*.tar.gz
            dist/SHA256SUMS.txt
